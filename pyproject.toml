[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow"
version = "1.0.0"
description = "Application de gestion de tâches en Python"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
taskflow = "src.main:main"

[tool.setuptools]
packages = ["src"]